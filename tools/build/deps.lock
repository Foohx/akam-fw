# Go toolchain for the native assistant (tools/assistant): the OFFICIAL release from https://go.dev/dl/.
# GO_VERSION is the EXACT release used for release builds: tools/assistant/build.sh (all, flat, repro) and
# tools/release/build_assistant.sh refuse any other `go version` unless AKAM_ALLOW_ANY_GO=1 (then the result
# is not a release). bootstrap.sh downloads the archive of the host (GO_URL_<os>_<arch>, sha256-checked) into
# tools/.toolchain/go-<version>-<os>-<arch>/ (project-local: never system-wide, never ~/go); build.sh and
# the tests prefer it over the go of PATH. go.mod keeps `go 1.26.0` as the language minimum.
# Modules are pinned by tools/assistant/go.sum (sumdb-verified). Hashes: field "sha256" of https://go.dev/dl/?mode=json.
GO_VERSION=1.27.4
GO_NOTE="release builds need exactly Go 1.27.4 (go.mod says 1.26.0); bootstrap.sh installs it in tools/.toolchain/"
GO_URL_linux_amd64=https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
